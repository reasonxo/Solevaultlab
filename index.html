<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLEVAULT V22 Model Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#080e0a;color:#eaffdc;font:15px system-ui}.wrap{max-width:750px;margin:auto;padding:18px}h1{color:#baff43}button{padding:12px;border-radius:10px;background:#1c3020;color:white;border:1px solid #608944;margin:4px}button.active{background:#baff43;color:#0b1409}#stage{height:60vh;min-height:300px;background:radial-gradient(#29402d,#050a07);border:1px solid #416038;border-radius:16px;touch-action:none;position:relative}canvas{display:block;width:100%;height:100%}#msg{color:#c9d8bd}small{color:#b0bca9}</style></head><body><div class="wrap"><h1>👟 SOLEVAULT / MODEL LAB</h1><p>V22 candidate inspection — not connected to your live collection.</p><div id="choices"></div><div id="stage"></div><p id="msg">Preparing viewer...</p><small>Drag to rotate • Pinch to zoom • This test uses internet access for the Three.js viewer.</small></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const shoes=[['New Jordans','new_jordans.glb'],['Jordan 3D','jordan_3d.glb'],['Jordans Retopo (legacy materials)','nike_air_jordans_retopo (1).glb']];
const stage=document.getElementById('stage'),msg=document.getElementById('msg'),choices=document.getElementById('choices');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x50684b,3));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(3,5,8);scene.add(light);
const camera=new THREE.PerspectiveCamera(40,1,.01,1000);camera.position.set(2,1.4,3);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
let current=null;function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function fit(obj){const b=new THREE.Box3().setFromObject(obj),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());if(!Number.isFinite(size.length())||size.length()===0)throw Error('Invalid model dimensions');obj.position.sub(center);const max=Math.max(size.x,size.y,size.z);obj.scale.setScalar(2/max);camera.position.set(2,1.3,3.3);controls.target.set(0,0,0);controls.update()}
async function load(i){for(const [n,b] of [...choices.children].entries())b.classList.toggle('active',n===i);msg.textContent='Loading '+shoes[i][0]+'...';try{const r=await fetch(encodeURI(shoes[i][1]));if(!r.ok)throw Error('HTTP '+r.status);const buffer=await r.arrayBuffer();const result=await new Promise((resolve,reject)=>new GLTFLoader().parse(buffer,'',resolve,reject));if(current)scene.remove(current);current=result.scene;scene.add(current);fit(current);msg.textContent=shoes[i][0]+' — loaded! Drag to inspect.'}catch(e){msg.textContent='Could not load: '+e.message+' (this model may require material conversion)';console.error(e)}}
shoes.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>load(i);choices.append(b)});function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}tick();load(0);
</script></body></html>
